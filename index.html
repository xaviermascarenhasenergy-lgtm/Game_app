      const k = SHOT_KINDS[s.kind];
      if (s.kind === 'missile') {
        ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a + Math.PI / 2);
        ctx.fillStyle = '#3a3f58'; rr(-3.5, -10, 7, 18, 3); ctx.fill();
        ctx.fillStyle = k.color; ctx.fillRect(-3.5, 4, 7, 4);
        ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.moveTo(-3, -10); ctx.lineTo(0, -17 - Math.random() * 5); ctx.lineTo(3, -10); ctx.fill();
        ctx.restore();
        continue;
      }
      if (s.kind === 'shard') {
        ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.atan2(s.vy, s.vx));
        ctx.fillStyle = k.color;
        ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(0, 4); ctx.lineTo(-8, 0); ctx.lineTo(0, -4); ctx.fill();
        ctx.restore();
        continue;
      }
      ctx.fillStyle = k.color;
      ctx.globalAlpha = 0.35;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 2, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.45, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawBolts() {
    for (const bo of S.bolts) {
      if (bo.t < 0) continue;
      if (!bo.struck) {
        const a = 0.15 + 0.2 * Math.abs(Math.sin(bo.t * 18));
        ctx.fillStyle = `rgba(255,236,120,${a})`;
        ctx.fillRect(bo.x - 30, 60, 60, H - 110);
        ctx.strokeStyle = 'rgba(255,236,120,.7)'; ctx.setLineDash([8, 8]); ctx.lineWidth = 2;
        ctx.strokeRect(bo.x - 30, 60, 60, H - 110);
        ctx.setLineDash([]);
      } else {
        const a = 1 - (bo.t - bo.warn) / 0.3;
        ctx.strokeStyle = `rgba(255,250,210,${a})`; ctx.lineWidth = 5; ctx.lineJoin = 'miter';
        ctx.beginPath();
        let x = bo.x; ctx.moveTo(x, 60);
        for (let y = 60; y < H - 50; y += 36) { x = bo.x + rand(-18, 18); ctx.lineTo(x, y); }
        ctx.stroke();
        ctx.strokeStyle = `rgba(255,236,120,${a * 0.5})`; ctx.lineWidth = 16; ctx.stroke();
      }
    }
  }

  function drawBossBar(b) {
    const x = 14, y = 64, w = W - 28;
    ctx.fillStyle = 'rgba(12,13,30,.85)';
    rr(x, y, w, 20, 5); ctx.fill();
    ctx.fillStyle = '#ff3d6e';
    rr(x + 2, y + 2, Math.max(0, (w - 4) * b.hp / b.maxHp), 16, 4); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 11px "Chakra Petch", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(b.name.toUpperCase(), x + 8, y + 10.5);
    ctx.textAlign = 'right';
    ctx.fillText(Math.ceil(b.hp).toLocaleString('en-GB') + ' / ' + b.maxHp.toLocaleString('en-GB'), x + w - 8, y + 10.5);
  }

  function drawLaser(l) {
    const flick = 0.75 + Math.random() * 0.25;
    ctx.save();
    ctx.globalAlpha = 0.35 * flick;
    ctx.fillStyle = '#ff7ad9';
    ctx.fillRect(l.x - 7, l.y1, 14, l.y0 - l.y1);
    ctx.globalAlpha = flick;
    ctx.fillStyle = '#ffd6f5';
    ctx.fillRect(l.x - 2.5, l.y1, 5, l.y0 - l.y1);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(l.x, l.y1, 7 * flick, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawSaber(p) {
    const prog = 1 - S.saberT / 0.25;
    const a0 = -Math.PI * 0.95, a1 = -Math.PI * 0.05;
    const a = a0 + (a1 - a0) * prog;
    const cx = p.x, cy = p.y - 6, r = SABER_RANGE;
    ctx.save();
    // swept trail
    ctx.lineCap = 'butt';
    ctx.strokeStyle = 'rgba(191,244,255,.18)';
    ctx.lineWidth = r * 0.3;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.7, a0, a); ctx.stroke();
    ctx.lineCap = 'round';
    // blade
    ctx.strokeStyle = 'rgba(94,224,255,.55)';
    ctx.lineWidth = 12;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 18, cy + Math.sin(a) * 18); ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.stroke();
    ctx.strokeStyle = '#f2fdff';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 18, cy + Math.sin(a) * 18); ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.stroke();
    ctx.restore();
  }

  function drawTurret(t) {
    ctx.save();
    ctx.translate(t.x, t.y);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(5, 9, 14, 10, 0, 0, Math.PI * 2); ctx.fill();
    // base
    const hot = t.cool > 0;
    ctx.fillStyle = '#1f3a1a';
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 + Math.PI / 8;
      ctx.lineTo(Math.cos(a) * 14, Math.sin(a) * 14);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = t.hit > 0 ? '#ffffff' : '#9be15d';
    ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
    // barrel
    ctx.save();
    ctx.rotate(t.aim + Math.PI / 2);
    ctx.fillStyle = hot ? '#ff5c3a' : '#e6ffd0';
    ctx.fillRect(-2.5, -20, 5, 14);
    ctx.restore();
    ctx.fillStyle = '#1f3a1a';
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
    // hp bar
    ctx.fillStyle = 'rgba(10,11,26,.85)';
    rr(-16, -26, 32, 5, 2); ctx.fill();
    ctx.fillStyle = '#9be15d';
    rr(-15.5, -25.5, 31 * t.hp / t.maxHp, 4, 2); ctx.fill();
    // heat bar
    ctx.fillStyle = 'rgba(10,11,26,.85)';
    rr(-16, 18, 32, 5, 2); ctx.fill();
    if (hot) {
      ctx.fillStyle = Math.floor(S.t * 8) % 2 ? '#ff5c3a' : '#ffb347';
      rr(-15.5, 18.5, 31 * (t.cool / TURRET_COOL_TIME), 4, 2); ctx.fill();
      ctx.fillStyle = '#ff5c3a';
      ctx.font = '700 8px "Chakra Petch", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('OVERHEAT', 0, 25);
    } else {
      ctx.fillStyle = '#ffb347';
      rr(-15.5, 18.5, 31 * Math.min(1, t.heat / TURRET_FIRE_TIME), 4, 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawEnemy(e) {
    const t = e.tier, x = e.x - e.w / 2, y = e.y - e.h / 2;
    const idx = TIERS.indexOf(t);
    ctx.save();
    // headlight glow toward player
    const g = ctx.createLinearGradient(0, e.y + e.h / 2, 0, e.y + e.h / 2 + 90);
    g.addColorStop(0, 'rgba(255,240,190,.18)');
    g.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(e.x - e.w * 0.35, e.y + e.h / 2);
    ctx.lineTo(e.x - e.w * 0.7, e.y + e.h / 2 + 90);
    ctx.lineTo(e.x + e.w * 0.7, e.y + e.h / 2 + 90);
    ctx.lineTo(e.x + e.w * 0.35, e.y + e.h / 2);
    ctx.fill();
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    rr(x + 4, y + 6, e.w, e.h, 8); ctx.fill();

    if (idx === 3) {
      // treads
      ctx.fillStyle = '#0d0e1c';
      rr(x - 4, y + 4, 12, e.h - 8, 4); ctx.fill();
      rr(x + e.w - 8, y + 4, 12, e.h - 8, 4); ctx.fill();
      ctx.fillStyle = '#34365a';
      for (let ty = y + 8 + ((S.t * 60) % 10); ty < y + e.h - 8; ty += 10) {
        ctx.fillRect(x - 3, ty, 10, 2); ctx.fillRect(x + e.w - 7, ty, 10, 2);
      }
    }
    // body
    ctx.fillStyle = t.color;
    rr(x, y, e.w, e.h, idx === 3 ? 6 : 10); ctx.fill();
    ctx.fillStyle = t.dark;
    if (idx < 2) {
      // roof + windscreen facing the player
      rr(x + 6, y + e.h * 0.28, e.w - 12, e.h * 0.4, 6); ctx.fill();
      ctx.fillStyle = '#1a1c38';
      rr(x + 7, y + e.h * 0.62, e.w - 14, e.h * 0.12, 3); ctx.fill();
      if (idx === 1) { ctx.fillStyle = t.dark; ctx.fillRect(x + 4, y + 4, e.w - 8, e.h * 0.2); }
    } else if (idx === 2) {
      for (let i = 0; i < 4; i++) ctx.fillRect(x + 6, y + 10 + i * (e.h - 30) / 4, e.w - 12, 6);
      ctx.fillStyle = '#1a1c38';
      rr(x + 10, y + e.h * 0.74, e.w - 20, 8, 2); ctx.fill();
    } else {
      rr(x + 10, y + 12, e.w - 20, e.h - 24, 6); ctx.fill();
      ctx.fillStyle = '#2c1024';
      ctx.beginPath(); ctx.arc(e.x, e.y, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = t.color;
      ctx.beginPath(); ctx.arc(e.x, e.y, 11, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2c1024';
      ctx.fillRect(e.x - 3, e.y + 8, 6, e.h / 2 + 4);
    }
    // headlights
    ctx.fillStyle = '#fff4c2';
    ctx.fillRect(x + 4, y + e.h - 6, 9, 4);
    ctx.fillRect(x + e.w - 13, y + e.h - 6, 9, 4);
    // hit flash
    if (e.hit > 0) {
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = '#ffffff';
      rr(x, y, e.w, e.h, 10); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // hp bar
    const bw = Math.max(44, e.w), bx = e.x - bw / 2, by = y - 16;
    ctx.fillStyle = 'rgba(10,11,26,.85)';
    rr(bx, by, bw, 11, 3); ctx.fill();
    ctx.fillStyle = t.color;
    rr(bx + 1, by + 1, Math.max(0, (bw - 2) * e.hp / e.maxHp), 9, 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 9px "Chakra Petch", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(Math.ceil(e.hp), e.x, by + 6);
    ctx.restore();
  }

  function drawBox(b) {
    const def = BOX[b.type];
    ctx.save();
    ctx.translate(b.x, b.y);
    if (def.rare) {
      const pulse = 0.5 + 0.5 * Math.sin(S.t * 8);
      ctx.fillStyle = `rgba(255,122,217,${0.15 + 0.2 * pulse})`;
      ctx.beginPath(); ctx.arc(0, 0, 26 + 4 * pulse, 0, Math.PI * 2); ctx.fill();
    }
    ctx.rotate(Math.sin(b.spin) * 0.15);
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    rr(-13, -11, 30, 30, 6); ctx.fill();
    ctx.fillStyle = def.color;
    rr(-15, -15, 30, 30, 6); ctx.fill();
    ctx.strokeStyle = def.rare ? '#ffffff' : 'rgba(15,16,36,.5)';
    ctx.lineWidth = 2;
    rr(-15, -15, 30, 30, 6); ctx.stroke();
    ctx.fillStyle = '#0f1024';
    ctx.font = '700 12px "Chakra Petch", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(def.label(S), 0, 1);
    ctx.restore();
  }

  function drawHUD() {
    const p = S.p;
    // top panel
    ctx.fillStyle = 'rgba(12,13,30,.82)';
    ctx.fillRect(0, 0, W, 56);
    ctx.fillStyle = '#34376a';
    ctx.fillRect(0, 56, W, 1);

    ctx.textBaseline = 'alphabetic';
    // HP
    ctx.textAlign = 'left';
    ctx.fillStyle = '#9a9cc4';
    ctx.font = '600 10px "Chakra Petch", sans-serif';
    ctx.fillText('HEALTH', 14, 20);
    ctx.fillStyle = '#24264a';
    rr(14, 26, 118, 14, 4); ctx.fill();
    const hpR = p.hp / p.maxHp;
    ctx.fillStyle = hpR > 0.5 ? '#6ee7a8' : hpR > 0.25 ? '#ffd166' : '#ff6b6b';
    rr(15, 27, Math.max(0, 116 * hpR), 12, 3); ctx.fill();
    ctx.fillStyle = '#0f1024';
    ctx.font = '700 10px "Chakra Petch", sans-serif';
    ctx.fillText(Math.ceil(p.hp) + ' / ' + p.maxHp, 20, 37);
    if (S.armour > 0) {
      ctx.fillStyle = '#8fb8ff';
      ctx.font = '700 9px "Chakra Petch", sans-serif';
      ctx.fillText('ARMOUR ' + Math.ceil(S.armour).toLocaleString('en-GB'), 14, 51);
    }

    // level
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffb347';
    ctx.font = '18px "Bungee", sans-serif';
    ctx.fillText('LVL ' + S.level, W / 2, 26);
    ctx.fillStyle = '#24264a';
    rr(W / 2 - 50, 34, 100, 6, 3); ctx.fill();
    ctx.fillStyle = '#ffb347';
    rr(W / 2 - 50, 34, 100 * (S.levelT / LEVEL_TIME), 6, 3); ctx.fill();
    ctx.fillStyle = '#9a9cc4';
    ctx.font = '600 9px "Chakra Petch", sans-serif';
    ctx.fillText(S.boss ? 'BOSS FIGHT' : Math.ceil(LEVEL_TIME - S.levelT) + 's left', W / 2, 51);

    // score
    ctx.textAlign = 'right';
    ctx.fillStyle = '#9a9cc4';
    ctx.font = '600 10px "Chakra Petch", sans-serif';
    ctx.fillText('POINTS', W - 14, 18);
    ctx.fillStyle = '#eef0ff';
    ctx.font = '700 18px "Chakra Petch", sans-serif';
    ctx.fillText(S.points.toLocaleString('en-GB'), W - 14, 37);
    ctx.fillStyle = '#8fb8ff';
    ctx.font = '600 9px "Chakra Petch", sans-serif';
    ctx.fillText('B = shop', W - 14, 51);

    // weapon panel
    const py = H - 44;
    ctx.fillStyle = 'rgba(12,13,30,.82)';
    ctx.fillRect(0, py, W, 44);
    ctx.fillStyle = '#34376a';
    ctx.fillRect(0, py, W, 1);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = '600 9px "Chakra Petch", sans-serif';
    ctx.fillStyle = '#9a9cc4';
    ctx.fillText('GUN', 14, py + 14);
    ctx.fillStyle = '#5ee0ff';
    ctx.font = '700 15px "Chakra Petch", sans-serif';
    ctx.fillText('×' + S.shot, 14, py + 30);
    ctx.fillStyle = '#ffd166';
    ctx.fillText(S.rate + '/s', 46, py + 30);
    ctx.fillStyle = '#9a9cc4';
    ctx.font = '600 9px "Chakra Petch", sans-serif';
    ctx.fillText((BULLET_DMG * POWER_STEPS[S.power]) + ' DMG', 88, py + 30);

    // missiles
    const mx = 170;
    ctx.fillStyle = '#9a9cc4';
    ctx.fillText('MISSILES · ' + S.mDmg + ' DMG', mx, py + 14);
    for (let i = 0; i < S.mCap; i++) {
      const on = i < S.missiles;
      ctx.fillStyle = on ? (S.mDmg > 100 ? '#ff5c5c' : '#ff7ad9') : '#24264a';
      rr(mx + i * 18, py + 22, 12, 16, 3); ctx.fill();
      if (on) { ctx.fillStyle = '#ffffff'; ctx.fillRect(mx + i * 18 + 4, py + 24, 4, 4); }
    }
    if (S.missiles < S.mCap) {
      ctx.fillStyle = '#eef0ff';
      ctx.font = '700 11px "Chakra Petch", sans-serif';
      ctx.fillText('reload ' + Math.ceil(S.mReload) + 's', mx + S.mCap * 18 + 6, py + 30);
    }

    ctx.textAlign = 'right';
    if (S.turrets.length) {
      ctx.fillStyle = '#9a9cc4';
      ctx.font = '600 9px "Chakra Petch", sans-serif';
      ctx.fillText('TURRETS', W - 12, py + 14);
      ctx.fillStyle = '#9be15d';
      ctx.font = '700 12px "Chakra Petch", sans-serif';
      ctx.fillText(S.turrets.length + ' · ' + S.tRate + '/s' + (S.tMsl ? ' · M' + S.tMsl : ''), W - 12, py + 30);
    } else {
      ctx.fillStyle = muted ? '#ff6b6b' : '#5b5e8e';
      ctx.font = '600 9px "Chakra Petch", sans-serif';
      ctx.fillText(muted ? 'MUTED (M)' : 'P pause · M mute', W - 12, py + 30);
    }
  }

  function unlockText(L) {
    if (L === 2) return 'Haulers join · 200 HP';
    if (L === 4) return 'Armour joins · 500 HP';
    if (L === 5) return 'Turret boxes unlocked';
    if (L === 6) return 'Juggernauts join · 1000 HP';
    if (L === 7) return 'Turret upgrades: fire rate + missiles';
    if (L === 9) return 'Armour unlocked: boxes and shop';
    return 'More traffic, faster';
  }

  function draw() {
    ctx.save();
    if (S.shake > 0) ctx.translate(rand(-S.shake, S.shake) * 0.5, rand(-S.shake, S.shake) * 0.5);
    drawRoad();
    for (const b of S.boxes) drawBox(b);
    for (const e of S.enemies) drawEnemy(e);
    if (S.boss) drawBoss(S.boss);
    if (S.boss) { drawBolts(); drawEnemyShots(); }
    if (S.laser) drawLaser(S.laser);
    // bullets
    ctx.fillStyle = '#bff4ff';
    for (const b of S.bullets) {
      if (b.turret) {
        ctx.fillStyle = 'rgba(155,225,93,.4)';
        ctx.beginPath(); ctx.arc(b.x, b.y, 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#efffe0';
        ctx.beginPath(); ctx.arc(b.x, b.y, 2.2, 0, Math.PI * 2); ctx.fill();
        continue;
      }
      ctx.fillStyle = 'rgba(94,224,255,.35)';
      ctx.fillRect(b.x - 3, b.y - 2, 6, 16);
      ctx.fillStyle = '#e9fbff';
      ctx.fillRect(b.x - 1.5, b.y, 3, 12);
    }
    // rockets
    for (const r of S.rockets) {
      ctx.strokeStyle = 'rgba(255,179,71,.45)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      r.trail.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)));
      ctx.stroke();
      ctx.save();
      ctx.translate(r.x, r.y);
      ctx.rotate(r.a + Math.PI / 2);
      ctx.fillStyle = r.dmg > 100 ? '#ff5c5c' : '#ff7ad9';
      rr(-3.5, -10, 7, 18, 3); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-2, -10, 4, 4);
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.moveTo(-3, 8); ctx.lineTo(0, 15 + Math.random() * 5); ctx.lineTo(3, 8); ctx.fill();
      ctx.restore();
    }
    for (const t of S.turrets) drawTurret(t);
    if (mode !== 'dying' && mode !== 'over') drawBike(S.p);
    if (S.saberT > 0) drawSaber(S.p);
    // particles
    for (const q of S.parts) {
      ctx.globalAlpha = Math.max(0, q.life / q.max);
      ctx.fillStyle = q.color;
      ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
    }
    ctx.globalAlpha = 1;
    // floaters
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of S.floaters) {
      ctx.globalAlpha = Math.max(0, f.life / f.max);
      ctx.fillStyle = f.color;
      ctx.font = f.big ? '700 16px "Chakra Petch", sans-serif' : '700 12px "Chakra Petch", sans-serif';
      ctx.fillText(f.txt, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (mode !== 'menu') drawHUD();
    if (S.boss && mode !== 'menu') drawBossBar(S.boss);

    // level banner
    if (mode === 'play' && S.banner > 0) {
      const a = Math.min(1, S.banner / 0.5, (2.4 - S.banner) / 0.3 + 0.001);
      ctx.globalAlpha = clamp(a, 0, 1);
      ctx.fillStyle = 'rgba(12,13,30,.75)';
      ctx.fillRect(0, H / 2 - 60, W, 104);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#c2410c';
      ctx.font = '44px "Bungee", sans-serif';
      ctx.fillText('LEVEL ' + S.level, W / 2 + 3, H / 2 - 15);
      ctx.fillStyle = '#ffb347';
      ctx.fillText('LEVEL ' + S.level, W / 2, H / 2 - 18);
      ctx.fillStyle = '#eef0ff';
      ctx.font = '600 14px "Chakra Petch", sans-serif';
      ctx.fillText(S.level === 1 ? 'Survive 30 seconds · Scouts ahead' : S.boss ? S.boss.name + ' · W laser · F saber' : unlockText(S.level), W / 2, H / 2 + 24);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- screens ----------
  const chip = (c, t) => `<span class="chip" style="background:${c}">${t}</span>`;
  function showMenu() {
    mode = 'menu';
    card.innerHTML = `
      <p class="eyebrow">Night run · 30-second levels · ${GAME_VERSION}</p>
      <h1>Throttle<br><span>Siege</span></h1>
      <dl class="keys">
        <dt><kbd>←</kbd><kbd>→</kbd></dt><dd>Steer</dd>
        <dt><kbd>↑</kbd><kbd>↓</kbd></dt><dd>Ride forward and back</dd>
        <dt><kbd>Tab</kbd></dt><dd>Jump over traffic (10% damage, not 25%)</dd>
        <dt><kbd>W</kbd></dt><dd>Fire gun, hold for auto (20 dmg)</dd>
        <dt><kbd>E</kbd></dt><dd>Homing missile (100 dmg)</dd>
        <dt><kbd>F</kbd></dt><dd>Light saber, boss fights (W becomes a laser)</dd>
        <dt><kbd>B</kbd></dt><dd>Points shop</dd>
        <dt><kbd>P</kbd></dt><dd>Pause</dd>
      </dl>
      <ul class="chips">
        <li>${chip('#5ee0ff', '×2')} More bullets</li>
        <li>${chip('#ffd166', '2/s')} Fire rate</li>
        <li>${chip('#ff7ad9', 'M3')} Missile slots</li>
        <li>${chip('#ff5c5c', '200')} Missile dmg</li>
        <li>${chip('#6ee7a8', '+HP')} Repair, 30 → 300</li>
        <li>${chip('#9be15d', 'TUR')} Turret, level 5+</li>
        <li>${chip('#8fb8ff', 'ARM')} Armour, level 9+</li>
      </ul>
      <div class="setting">
        <p class="label">Spare repairs top up rear turrets</p>
        <div class="seg" id="ovSeg">
          <button data-ov="health">Once health is full</button>
          <button data-ov="armour">Once health and armour are full</button>
          <button data-ov="all">Once health, armour and front turrets are full</button>
        </div>
      </div>
      <div class="row">
        <button class="primary" id="startBtn">Start ride</button>
        <button class="ghost" id="muteBtn">Sound: ${muted ? 'off' : 'on'}</button>
      </div>
      <p class="note">Each enemy is worth its health in points. A crash costs 25% of the enemy's health, one that gets past costs 10%. Boxes drop from destroyed enemies.${best ? ' Best score ' + best.toLocaleString('en-GB') + '.' : ''}</p>`;
    overlay.hidden = false;
    document.getElementById('startBtn').onclick = startGame;
    const seg = document.getElementById('ovSeg');
    const markSeg = () => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ov === settings.overflow)));
    seg.querySelectorAll('button').forEach(b => b.onclick = () => { settings.overflow = b.dataset.ov; saveSettings(); markSeg(); });
    markSeg();
    document.getElementById('muteBtn').onclick = e => { muted = !muted; e.target.textContent = 'Sound: ' + (muted ? 'off' : 'on'); };
    document.getElementById('startBtn').focus({ preventScroll: true });
  }
  function startGame() {
    ensureAudio();
    stopMusic();
    S = newState();
    mode = 'play';
    overlay.hidden = true;
    canvas.focus && canvas.focus();
    sfx('level');
  }
  function togglePause() {
    if (mode === 'play') {
      mode = 'paused';
      card.innerHTML = `
        <p class="eyebrow">Level ${S.level} · ${Math.ceil(LEVEL_TIME - S.levelT)}s left</p>
        <h1>Paused</h1>
        <div class="row"><button class="primary" id="resumeBtn">Resume</button><button class="ghost" id="shopBtn">Shop</button><button class="ghost" id="quitBtn">Quit to menu</button></div>
        <p class="note">Press P or Esc to resume.</p>`;
      overlay.hidden = false;
      document.getElementById('resumeBtn').onclick = togglePause;
      document.getElementById('shopBtn').onclick = () => { mode = 'play'; openShop(); };
      document.getElementById('quitBtn').onclick = () => { stopMusic(); S = newState(); showMenu(); };
      document.getElementById('resumeBtn').focus({ preventScroll: true });
    } else if (mode === 'paused') {
      mode = 'play';
      overlay.hidden = true;
      last = performance.now();
    }
  }
  // shop pauses the ride while open
  function openShop() {
    if (mode !== 'play') return;
    mode = 'shop';
    HELD.forEach(k => keys[k] = false);
    renderShop();
    overlay.hidden = false;
  }
  function closeShop() {
    if (mode !== 'shop') return;
    mode = 'play';
    overlay.hidden = true;
    last = performance.now();
  }
  function renderShop() {
    const items = shopItems();
    card.innerHTML = `
      <p class="eyebrow">Points shop · ride paused</p>
      <p class="wallet">${S.points.toLocaleString('en-GB')} <small>POINTS</small></p>
      <div class="shoplist">
        ${items.map((it, i) => {
          const off = it.maxed || it.locked || it.cost == null || S.points < it.cost;
          const price = it.maxed ? 'MAX' : it.locked ? '—' : it.cost.toLocaleString('en-GB');
          return `<button class="shopitem" data-i="${i}" ${off ? 'disabled' : ''}>
            <span class="n">${i + 1}</span>
            <span class="t"><b>${it.name}</b><small>${it.desc}</small></span>
            <span class="c">${price}</span>
          </button>`;
        }).join('')}
      </div>
      <div class="row"><button class="primary" id="closeShopBtn">Back to the road</button></div>
      <p class="note">Press 1–9 to buy, B or Esc to close.</p>`;
    card.querySelectorAll('.shopitem').forEach(b => b.onclick = () => buyItem(parseInt(b.dataset.i, 10)));
    document.getElementById('closeShopBtn').onclick = closeShop;
    document.getElementById('closeShopBtn').focus({ preventScroll: true });
  }

  function gameOver() {
    mode = 'over';
    const isBest = S.score > best;
    if (isBest) { best = S.score; saveBest(); }
    card.innerHTML = `
      <p class="eyebrow">${isBest ? 'New best score' : 'Bike destroyed'}</p>
      <h1>Wrecked</h1>
      <div class="stats">
        <div class="stat"><small>Level</small><b>${S.level}</b></div>
        <div class="stat"><small>Kills</small><b>${S.kills}</b></div>
        <div class="stat"><small>Score</small><b>${S.score.toLocaleString('en-GB')}</b></div>
      </div>
      <div class="row"><button class="primary" id="againBtn">Ride again</button><button class="ghost" id="menuBtn">Menu</button></div>
      <p class="note">Best ${best.toLocaleString('en-GB')} · Press Enter to restart.</p>`;
    overlay.hidden = false;
    document.getElementById('againBtn').onclick = startGame;
    document.getElementById('menuBtn').onclick = () => { S = newState(); showMenu(); };
    document.getElementById('againBtn').focus({ preventScroll: true });
  }

  // ---------- attract mode: a little traffic behind the menu ----------
  function seedMenuScene() {
    S = newState();
    S.enemies.push(
      { tier: TIERS[0], hp: 60, maxHp: 100, w: 40, h: 66, x: laneX(0), tx: laneX(0), lane: 0, y: 190, vy: 0, hit: 0 },
      { tier: TIERS[2], hp: 500, maxHp: 500, w: 60, h: 104, x: laneX(2), tx: laneX(2), lane: 2, y: 250, vy: 0, hit: 0 },
      { tier: TIERS[1], hp: 200, maxHp: 200, w: 48, h: 82, x: laneX(3), tx: laneX(3), lane: 3, y: 420, vy: 0, hit: 0 }
    );
    spawnBox(laneX(1), 380, 'shot');
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (mode === 'play' || mode === 'dying') update(dt);
    else if (mode === 'menu') {
      S.roadOff = (S.roadOff + 330 * dt) % 80;
      S.sideOff = (S.sideOff + 330 * dt) % 160;
      S.t += dt;
      for (const b of S.boxes) b.spin += dt * 2;
    }
    draw();
    requestAnimationFrame(frame);
  }

  document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') togglePause(); });

  seedMenuScene();
  showMenu();
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => draw());
})();
</script>
</body>
</html>
